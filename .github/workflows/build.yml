name: Build slides

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX (handout build)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: handout.tex
          latexmk_use_xelatex: false
          latexmk_use_lualatex: false
          continue_on_error: false

      - name: Stage PDF + landing page for GitHub Pages
        run: |
          mkdir -p _site
          # Published filename stays `main.pdf` so existing URLs keep working;
          # the underlying build is the overlays-flattened handout.
          cp handout.pdf _site/main.pdf
          cp handout.pdf main.pdf
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Can ExaModels Power JuMP on GPUs? — Slides</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
            body { font-family: system-ui, sans-serif; max-width: 42em;
                   margin: 4em auto; padding: 0 1em; color: #222; line-height: 1.5; }
            h1   { color: #A31F34; margin-bottom: 0.2em; }
            .sub { color: #545454; font-style: italic; margin-top: 0; }
            .meta { color: #545454; font-size: 0.95em; }
            a   { color: #A31F34; }
            .download {
              display: inline-block; padding: 0.6em 1.2em; margin-top: 1em;
              background: #A31F34; color: white; text-decoration: none;
              border-radius: 6px; font-weight: bold;
            }
            .download:hover { background: #7e1828; }
          </style>
          </head>
          <body>
            <h1>Can ExaModels Power JuMP on GPUs?</h1>
            <p class="sub">Blessing and curse of aggressive typing</p>
            <p class="meta">
              Sungho Shin (MIT) &middot; JuMP-dev 2026 &middot; Edinburgh
            </p>
            <p>
              <a class="download" href="main.pdf">Download slides (PDF)</a>
            </p>
            <p class="meta">
              Source on
              <a href="https://github.com/sshin23/slides-jump-dev-2026">GitHub</a>.
              Built automatically from <code>master</code>.
            </p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: rolling
          name: "Slides for JuMP-dev 2026 (rolling release)"
          body: |
            Auto-built from `master` (`${{ github.sha }}`).
            Also live at <https://sshin23.github.io/slides-jump-dev-2026/main.pdf>.
          artifacts: "main.pdf"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
